name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop -f github

  rspec:
    name: Testes (RSpec)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Banco de teste
        run: bin/rails db:prepare

      - name: RSpec
        run: bundle exec rspec

  cucumber:
    name: Cenários BDD (Cucumber)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Banco de teste
        run: bin/rails db:prepare

      - name: Cucumber
        run: bundle exec cucumber --format progress
